<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Badek badek an</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="game-container start-page">

        <div class="top-label">
            QUICK QUIZ
        </div>


        <div class="quiz-icon">
            <span>?</span>
        </div>


        <h1>
            Iwan Gabut
        </h1>


        <p class="deskripsi">
            Seberapa kemaluanmu?, eh kemampuanmu
        </p>


        <div class="game-info">

            <div class="info-item">
                <strong>15</strong>
                <span>SOAL</span>
            </div>


            <div class="info-divider"></div>


            <div class="info-item">
                <strong>10</strong>
                <span>POIN / SOAL</span>
            </div>


            <div class="info-divider"></div>


            <div class="info-item">
                <strong>A–D</strong>
                <span>PILIHAN</span>
            </div>

        </div>


        <button id="mulaiBtn">
            Ndang mulai gageh
            <span class="arrow">→</span>
        </button>


        <p class="start-note">
            Jawab semampunya aja, have fun!
        </p>

    </main>


    <script src="script.js"></script>

</body>

</html>
